hcn_switch_card:
  variables:
    power_entity: null # Optional: Entity for power consumption (e.g., 'sensor.switch_power')
    power_unit: W # Optional: Unit for power entity (e.g., 'W', 'kW', etc.)
    graph_color: white # Optional: Color of the graph line
    show_graph: false # Optional: Show graph
    show_graph_line: true # Optional: Show graph line
    show_graph_fill: false # Optional: Show graph
    show_graph_when_off: false # Optional: Show graph when the switch is off
    label_on: "on" # Optional: Custom label for "on" state
    label_off: "off" # Optional: Custom label for "off" state
  show_state: true
  styles:
    grid:
      - grid-template-areas: |
          '. i'
          'n n'
          's s'
          'graph graph'
      - grid-template-rows: min-content min-content 1fr
    card:
      - padding: 12px
      - height: 100px
    name:
      - text-align: left
      - font-weight: 700
      - justify-self: start
      - align-self: end
      - font-size: 14px
    state:
      - text-align: left
      - font-size: 11px
      - font-weight: 500
      - justify-self: start
      - align-self: center
      - color: var(--subtext-color)
    icon:
      - width: 50%
      - color: white
    img_cell:
      - background: var(--opacity-contrast-100)
      - border-radius: 50%
      - width: 35px
      - height: 35px
      - align-self: start
      - margin-bottom: 10px
    custom_fields:
      graph:
        - display: |
            [[[ 
              if (
                variables.show_graph && 
                (entity.state === "on" || variables.show_graph_when_off)
              ) {
                return 'block';
              } else {
                return 'none';
              }
            ]]]
        - position: absolute
        - left: 0
        - bottom: -1px
        - width: 100%
        - z-index: 1
        - pointer-events: none
  state:
    - value: "on"
      styles:
        card:
          - background: var(--primary-color)
        name:
          - color: white
        label:
          - color: white
        state:
          - color: white
      state_display: |
        [[[
          if (entity.state === "on" && variables.power_entity !== null) {
            return variables.label_on + " - " + states[variables.power_entity].state + variables.power_unit;
          } else {
            return states[entity.entity_id].state === 'on' ? variables.label_on : variables.label_off;
          }
        ]]]
    - value: "off"
      styles:
        icon:
          - color: var(--icon-color-default)
        img_cell:
          - background: var(--background-icon-color-default)
      state_display: |
        [[[
          return states[entity.entity_id].state === 'on' ? variables.label_on : variables.label_off;
        ]]]
    - value: unavailable
      styles:
        name:
          - text-decoration: line-through
        icon:
          - color: var(--icon-color-default)
        img_cell:
          - background: var(--background-icon-color-default)
        card:
          - opacity: 0.6
          - pointer-events: none
  custom_fields:
    graph:
      card:
        type: custom:mini-graph-card
        entities:
          - entity: "[[[ return variables.power_entity ]]]"
            show_fill: "[[[ return variables.show_graph_fill ]]]"
            show_line: "[[[ return variables.show_graph_line ]]]"
        animate: true
        show:
          name: false
          icon: false
          state: false
        line_width: 1
        line_color: |
          [[[
            if (entity.state === "on" && variables.power_entity !== null) {
              return variables.graph_color;
            } else {
              return 'var(--primary-color)';
            }
          ]]]
        hours_to_show: 24
        card_mod:
          style: |
            ha-card {
              background: none;
              box-shadow: none;
              --ha-card-border-width: 0;
              z-index: 1
            }
